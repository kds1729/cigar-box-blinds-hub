# Optional: lets people type http://blinds.local/ instead of http://blinds.local:8420/
# Copy to /etc/nginx/sites-available/blinds-redirect, link it into sites-enabled,
# remove sites-enabled/default, then: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 http://$host:8420$request_uri;
}
